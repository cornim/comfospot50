---
substitutions:
  device_name: luftung-xxx
  friendly_name: Lüftung xxx
external_components:
  - source:
      type: git
      url: https://github.com/cornim/comfospot50
      ref: main
    components: [comfospot]
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.1
  platformio_options:
    board_build.flash_mode: dio
esp32:
  board: esp32-c3-devkitm-1
  cpu_frequency: 80MHZ
  framework:
    type: esp-idf
logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG
api:
  encryption:
    key: !secret api_encryption_key
ota:
  platform: esphome
  password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name}
    password: !secret fallback_ap_password
captive_portal:

comfospot:
  id: comfospot_controller

fan:
  - platform: comfospot
    name: ${friendly_name}
    id: comfospot_fan
    comfospot_id: comfospot_controller

sensor:
  - platform: comfospot
    name: "Current Fan Speed"
    comfospot_id: comfospot_controller
    sensor_type: current_speed
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: comfospot
    name: "Filter Runtime"
    comfospot_id: comfospot_controller
    sensor_type: filter_runtime
    device_class: duration
    unit_of_measurement: d
    accuracy_decimals: 2
    entity_category: diagnostic

binary_sensor:
  - platform: comfospot
    name: "Change Filter"
    comfospot_id: comfospot_controller
    sensor_type: filter_change
    device_class: problem
  - platform: comfospot
    name: "Error LED"
    comfospot_id: comfospot_controller
    sensor_type: error
    device_class: problem
  - platform: comfospot
    name: "Automatic Mode LED"
    comfospot_id: comfospot_controller
    sensor_type: auto

select:
  - platform: comfospot
    name: Direction
    comfospot_id: comfospot_controller

button:
  - platform: comfospot
    name: Reset Filter
    comfospot_id: comfospot_controller
    entity_category: config
