# =============================================================================
# Ventilation Control Blueprint
# INSTALL: Copy to /config/blueprints/automation/custom/ventilation_control.yaml
# then Settings -> Automations & Scenes -> Blueprints -> Reload Blueprints.
# Computes V (0-4), mode (Exchange/Intake/Exhaust) and final level (0-4).
# Controls the configured ventilation direction select and fan percentage.
# =============================================================================
blueprint:
  name: Ventilation Control (V / mode / level) v1.4.3
  description: >
    Calculates ventilation level V from humidity results,
    picks mode (Exchange/Intake/Exhaust) and final level. Falls back to
    CO2-driven Exchange when V < 1 or outdoor air is too humid. Exhaust is
    selected when indoor humidity is above target. Outdoor humidity is adjusted
    to the indoor temperature before the score is calculated. Intake is not
    selected below 13 degrees C; the fan is limited to level 1 below -5
    degrees C and turned off below -12 degrees C. An optional second sensor can
    raise the air-quality level using its own thresholds. An optional switch
    can cap the fan level while it is on.
  domain: automation
  input:
    outdoor_temp:
      name: Outdoor temperature (T_O)
      selector:
        entity: { domain: sensor, device_class: temperature }
    indoor_temp:
      name: Indoor temperature (T_I)
      selector:
        entity: { domain: sensor, device_class: temperature }
    outdoor_humidity:
      name: Outdoor relative humidity
      selector:
        entity: { domain: sensor, device_class: humidity }
    indoor_humidity:
      name: Indoor relative humidity
      selector:
        entity: { domain: sensor, device_class: humidity }
    target_humidity:
      name: Target relative humidity (H_T) - number or entity
      description: "Enter a number (0-1 or 0-100) or an entity."
      selector:
        template:
    humidity_points_per_level:
      name: Humidity points per fan level
      description: >
        Total relative-humidity percentage points required to add one fan
        level. For example, a value of 10 requires a raw score of 10 per level.
      default: 10
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          mode: box
    negative_v_co2_multiplier:
      name: Negative V air-quality threshold multiplier (x)
      description: >
        Multiplier for CO2 and second-sensor thresholds when the raw ventilation
        score is negative. Effective thresholds are limit * (-V_raw * x + 1).
      default: 0
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          mode: box
    direction_select:
      name: Ventilation direction select
      selector:
        entity: { domain: select }
    ventilation_fan:
      name: Ventilation fan
      selector:
        entity: { domain: fan }
    co2_sensor:
      name: CO2 sensor
      selector:
        entity: { domain: sensor, device_class: carbon_dioxide }
    co2_limit_1:
      name: CO2 limit 1
      default: 500
      selector:
        number: { min: 0, max: 5000, unit_of_measurement: ppm, mode: box }
    co2_limit_2:
      name: CO2 limit 2
      default: 700
      selector:
        number: { min: 0, max: 5000, unit_of_measurement: ppm, mode: box }
    co2_limit_3:
      name: CO2 limit 3
      default: 1000
      selector:
        number: { min: 0, max: 5000, unit_of_measurement: ppm, mode: box }
    co2_limit_4:
      name: CO2 limit 4
      default: 1500
      selector:
        number: { min: 0, max: 5000, unit_of_measurement: ppm, mode: box }
    max_level_switch:
      name: Optional maximum-level switch
      description: >
        When on, limit the calculated fan level to the configured maximum.
        When off or unset, do not apply this additional cap.
      default: ""
      selector:
        entity:
          domain:
            - switch
            - input_boolean
    maximum_level:
      name: Maximum fan level while switch is on
      default: 4
      selector:
        number:
          min: 0
          max: 4
          step: 1
          mode: box
    second_sensor:
      name: Optional second air-quality sensor
      description: >
        If set and available with all four limits configured, its level is
        combined with CO2 using the higher level. If unset, unavailable, or its
        limits are blank, only CO2 is used. Set limits in this sensor's units.
      default: ""
      selector:
        entity: { domain: sensor }
    second_sensor_limit_1:
      name: Second sensor limit 1
      default: ""
      selector:
        number: { min: 0, max: 1000000, mode: box }
    second_sensor_limit_2:
      name: Second sensor limit 2
      default: ""
      selector:
        number: { min: 0, max: 1000000, mode: box }
    second_sensor_limit_3:
      name: Second sensor limit 3
      default: ""
      selector:
        number: { min: 0, max: 1000000, mode: box }
    second_sensor_limit_4:
      name: Second sensor limit 4
      default: ""
      selector:
        number: { min: 0, max: 1000000, mode: box }

triggers:
  # Re-evaluate every 10 minutes (target humidity may be a plain number, so we
  # don't rely on a state trigger from it).
  - minutes: /10
    trigger: time_pattern

variables:
  # Expose blueprint inputs to the automation-level condition and actions.
  t_o_ent: !input outdoor_temp
  t_i_ent: !input indoor_temp
  rh_o_ent: !input outdoor_humidity
  rh_i_ent: !input indoor_humidity
  co2_ent: !input co2_sensor
  second_sensor_ent: !input second_sensor
  max_level_switch_ent: !input max_level_switch
  direction_select_ent: !input direction_select
  ventilation_fan_ent: !input ventilation_fan
  h_t_in: !input target_humidity
  humidity_points_per_level: !input humidity_points_per_level
  negative_v_co2_multiplier: !input negative_v_co2_multiplier
  l1: !input co2_limit_1
  l2: !input co2_limit_2
  l3: !input co2_limit_3
  l4: !input co2_limit_4
  s1: !input second_sensor_limit_1
  s2: !input second_sensor_limit_2
  s3: !input second_sensor_limit_3
  s4: !input second_sensor_limit_4
  maximum_level: !input maximum_level

conditions:
  # Do not calculate or control anything while an input is in a failure state.
  - condition: template
    value_template: >-
      {{ has_value(t_o_ent) and
         (states(t_o_ent) | float(none)) is not none and
         has_value(t_i_ent) and
         (states(t_i_ent) | float(none)) is not none and
         has_value(rh_o_ent) and
         (states(rh_o_ent) | float(none)) is not none and
         has_value(rh_i_ent) and
         (states(rh_i_ent) | float(none)) is not none and
         has_value(co2_ent) and
         (states(co2_ent) | float(none)) is not none and
         has_value(direction_select_ent) and
         has_value(ventilation_fan_ent) and
         ((h_t_in | string | float(none)) is not none or
          (has_value(h_t_in) and
           (states(h_t_in) | float(none)) is not none)) }}

actions:
  - variables:
      # ----- read sensor values -----
      t_o: "{{ states(t_o_ent) | float(0) }}"
      t_i: "{{ states(t_i_ent) | float(0) }}"
      rh_o_raw: "{{ states(rh_o_ent) | float(0) }}"
      rh_i_raw: "{{ states(rh_i_ent) | float(0) }}"
      co2: "{{ states(co2_ent) | float(0) }}"

      # ----- target humidity: same number-or-entity handling -----
      h_t_raw: >-
        {{ (h_t_in | float(none)) if (h_t_in | string | float(none) is not none)
        else (states(h_t_in) | float(0)) }}

      # ----- normalise all RH to 0..1 (accepts sensors that report 0..100) -----
      rh_o: "{{ (rh_o_raw|float / 100) if rh_o_raw|float > 1 else rh_o_raw|float }}"
      rh_i: "{{ (rh_i_raw|float / 100) if rh_i_raw|float > 1 else rh_i_raw|float }}"
      h_t: "{{ (h_t_raw|float / 100) if h_t_raw|float > 1 else h_t_raw|float }}"

      # ----- Magnus saturation vapor pressure es(T)=6.112*e^(17.62T/(243.12+T)) -----
      # (e ** x is used because HA templates have no exp() function)
      es_ti: "{{ 6.112 * (e ** (17.62 * (t_i|float) / (243.12 + (t_i|float)))) }}"
      es_to: "{{ 6.112 * (e ** (17.62 * (t_o|float) / (243.12 + (t_o|float)))) }}"

      # ----- outdoor RH re-expressed at the indoor temperature, clamped <=1 -----
      # The ratio es(outdoor)/es(indoor) keeps absolute moisture constant.
      h_i: "{{ rh_i|float }}"
      h_o_raw: "{{ rh_o|float * es_to|float / es_ti|float }}"
      h_o: "{{ h_o_raw|float if h_o_raw|float < 1 else 1.0 }}"

      # ----- humidity product before square-root scaling -----
      h_product: "{{ (h_t|float - h_i|float) * (h_o|float - h_i|float) }}"

      # ----- humidity result H_R -----
      # HA supports sqrt(). Preserve the sign for unfavorable conditions,
      # because a negative product cannot be passed directly to sqrt().
      h_r: >-
        {{ ((1 if h_product|float >= 0 else -1) *
            sqrt((h_product|float) | abs) * 100) }}

      # ----- raw level score -----
      # Divide the humidity score by the configured points-per-level value.
      v_raw: "{{ h_r|float / humidity_points_per_level|float }}"
      # clamp v_raw into [0,4] then floor to an integer level
      v: "{{ (0 if v_raw|float < 0 else (4 if v_raw|float > 4 else v_raw|float)) | int }}"

      # ----- humidity state used to choose Exhaust vs Intake -----
      room_humidity_high: "{{ (h_i|float) > (h_t|float) }}"

      # ----- outdoor dew point via Magnus (gamma is the shared sub-term) -----
      # max(...,0.0001) guards against ln(0) when outdoor RH reads 0
      gamma: "{{ ([rh_o|float, 0.0001] | max | log) + 17.62 * (t_o|float) / (243.12 + (t_o|float)) }}"
      dp_out: "{{ (243.12 * gamma|float / (17.62 - gamma|float)) if (17.62 - gamma|float) != 0 else -100 }}"
      # too_humid: outdoor air would add moisture -> forbid intake/expel
      too_humid: "{{ dp_out|float > t_i|float }}"

      # ----- air-quality levels used when we fall back to Exchange -----
      air_quality_threshold_multiplier: >-
        {{ (((-(v_raw|float)) * (negative_v_co2_multiplier|float)) + 1)
           if v_raw|float < 0 else 1 }}
      second_sensor_thresholds_valid: >-
        {{ (s1 | string | trim != '') and
           (s2 | string | trim != '') and
           (s3 | string | trim != '') and
           (s4 | string | trim != '') and
           (s1 | float(none)) is not none and
           (s2 | float(none)) is not none and
           (s3 | float(none)) is not none and
           (s4 | float(none)) is not none }}
      co2_level: >-
        {% if co2|float < (l1|float * (air_quality_threshold_multiplier|float)) %}0{% elif
        co2|float < (l2|float * (air_quality_threshold_multiplier|float)) %}1{% elif
        co2|float < (l3|float * (air_quality_threshold_multiplier|float)) %}2{% elif
        co2|float < (l4|float * (air_quality_threshold_multiplier|float)) %}3{% else %}4{% endif %}
      second_sensor_level: >-
        {% if not (second_sensor_thresholds_valid | bool) or
              (second_sensor_ent | string | trim == '') or
              not has_value(second_sensor_ent) or
              (states(second_sensor_ent) | float(none)) is none %}0{% elif
        states(second_sensor_ent)|float < (s1|float * (air_quality_threshold_multiplier|float)) %}0{% elif
        states(second_sensor_ent)|float < (s2|float * (air_quality_threshold_multiplier|float)) %}1{% elif
        states(second_sensor_ent)|float < (s3|float * (air_quality_threshold_multiplier|float)) %}2{% elif
        states(second_sensor_ent)|float < (s4|float * (air_quality_threshold_multiplier|float)) %}3{% else %}4{% endif %}
      air_quality_level: "{{ [co2_level|int, second_sensor_level|int] | max }}"

      # ----- final decision -----
      # use CO2/Exchange when the humidity level is low or outside air is too humid
      use_co2: "{{ (v|int < 1) or (too_humid | bool) }}"
      calculated_mode: >-
        {% if use_co2 | bool %}Exchange{% elif room_humidity_high | bool %}Exhaust{% else %}Intake{% endif %}
      mode: >-
        {% if (t_o|float < 13) and calculated_mode|trim == 'Intake' %}Exchange{% else %}{{ calculated_mode | trim }}{% endif %}
      calculated_level: "{{ [air_quality_level|int, v|int] | max }}"
      switch_limited_level: >-
        {{ [calculated_level|int, maximum_level|int] | min
           if is_state(max_level_switch_ent, 'on') else calculated_level|int }}
      level: >-
        {{ ([switch_limited_level|int, 1] | min)
           if t_o|float < -5 else switch_limited_level|int }}
      fan_shutdown: "{{ t_o|float < -12 }}"

      final_mode: "{{ mode | trim }}"
      final_level: "{{ level | int }}"

  - if:
      - condition: template
        value_template: "{{ fan_shutdown | bool }}"
    then:
      - action: fan.turn_off
        target:
          entity_id: "{{ ventilation_fan_ent }}"
    else:
      - if:
          - condition: template
            value_template: "{{ states(direction_select_ent) != final_mode }}"
        then:
          - action: select.select_option
            target:
              entity_id: "{{ direction_select_ent }}"
            data:
              option: "{{ final_mode }}"

      - if:
          - condition: template
            value_template: >-
              {{ (is_state(ventilation_fan_ent, 'off') and
                  (final_level | int != 0)) or
                 ((not is_state(ventilation_fan_ent, 'off')) and
                  (state_attr(ventilation_fan_ent, 'percentage') | float(-1) !=
                   (final_level | int * 25))) }}
        then:
          - action: fan.set_percentage
            target:
              entity_id: "{{ ventilation_fan_ent }}"
            data:
              percentage: "{{ final_level | int * 25 }}"
