<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <title>ComfoSpot 50 ESP32-C3 chip-to-panel mapping</title>
  <rect width="720" height="420" fill="#ffffff"/>
  <rect x="35" y="75" width="220" height="270" rx="12" fill="#e8f0fe" stroke="#244a85" stroke-width="2"/>
  <text x="145" y="110" text-anchor="middle" font-family="sans-serif" font-size="22">ESP32-C3</text>
  <rect x="465" y="75" width="220" height="270" rx="12" fill="#eef7e8" stroke="#397329" stroke-width="2"/>
  <text x="575" y="110" text-anchor="middle" font-family="sans-serif" font-size="22">ComfoSpot panel</text>
  <g font-family="sans-serif" font-size="15">
    <text x="55" y="140">IO0 - led_1</text><text x="55" y="160">IO1 - led_3</text>
    <text x="55" y="180">IO3 - led_2</text><text x="55" y="200">IO4 - led_4</text>
    <text x="55" y="220">IO5 - btn_plus</text><text x="55" y="240">IO6 - btn_minus</text>
    <text x="55" y="260">IO7 - led_err</text><text x="55" y="280">IO10 - led_filter</text>
    <text x="55" y="300">TX0 / IO21 - led_auto</text>
    <text x="485" y="140">Fan LED 1</text><text x="485" y="160">Fan LED 3</text>
    <text x="485" y="180">Fan LED 2</text><text x="485" y="200">Fan LED 4</text>
    <text x="485" y="220">+ button line</text><text x="485" y="240">- button line</text>
    <text x="485" y="260">Error indication</text><text x="485" y="280">Filter warning</text>
    <text x="485" y="300">Automatic-mode LED</text>
  </g>
  <g stroke="#555" stroke-width="2" fill="none">
    <path d="M255 145 H465"/><path d="M255 165 H465"/><path d="M255 185 H465"/>
    <path d="M255 205 H465"/><path d="M255 225 H465"/><path d="M255 245 H465"/>
    <path d="M255 265 H465"/><path d="M255 285 H465"/><path d="M255 305 H465"/>
  </g>
  <text x="360" y="395" text-anchor="middle" font-family="sans-serif" font-size="13">Verify voltage levels and use isolation/level shifting where required</text>
</svg>
